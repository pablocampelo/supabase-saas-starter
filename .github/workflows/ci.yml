name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_local_test_fixture
      SUPPORT_EMAIL: support@example.com

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm

      - name: Frozen install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Production build
        run: pnpm build

      - name: Ensure local Supabase is stopped
        run: pnpm supabase:stop --no-backup || true

      - name: Start local Supabase
        run: pnpm supabase:start

      - name: Clean database reset
        run: pnpm supabase:db:reset

      - name: Database tests
        run: pnpm supabase:test:db

      - name: Regenerate database types
        run: pnpm supabase:types

      - name: Generated types unchanged
        run: git diff --exit-code -- lib/supabase/database.types.ts

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser E2E
        run: pnpm test:e2e

      - name: Stop local Supabase
        if: always()
        run: pnpm supabase:stop --no-backup
